[package]
name = "sonder-observatory"
version = "0.1.0"
description = "Standalone desktop shell for the Sonder Observatory telemetry viewer"
authors = ["Nate Witkowski"]
repository = "https://github.com/Krilliac/Sonder-Observatory"
edition = "2021"
rust-version = "1.88"
license = "Apache-2.0"
publish = false

[lib]
# `_lib` suffix avoids a Windows name clash between the bin and lib targets.
name = "sonder_observatory_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Tauri: MIT OR Apache-2.0. No optional features (no tray, no shell, no fs).
tauri = { version = "2", features = [] }
# Native dialog is invoked from Rust only; the webview gets no dialog permission.
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
