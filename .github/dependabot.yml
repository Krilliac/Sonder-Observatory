version: 2
# Weekly, grouped so each ecosystem opens at most one PR for minor/patch
# updates; major versions come as their own PRs. PRs into main get squash
# auto-merge and merge only once the required checks pass; major updates are
# never auto-merged (.github/workflows/auto-merge.yml) and wait for review.
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: deps
    ignore:
      # `typescript` stays on 6.x only as the compiler API typescript-eslint
      # loads; it has no TS 7 support yet (8.71 peers typescript <6.1). The
      # project type-checks with TS 7 via the `typescript-native` alias
      # (npm run typecheck), which Dependabot still updates. Drop this once
      # typescript-eslint supports TS 7.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
    groups:
      cargo-minor-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: deps

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
