name: Generate lockfiles

# Manual tool: regenerates package-lock.json and src-tauri/Cargo.lock (and,
# on request, the Tauri icon set) on a feature branch and commits them there,
# so large generated or binary files never have to be retyped through the
# GitHub API. Review the result in a normal PR.
on:
  workflow_dispatch:
    inputs:
      branch:
        description: Feature branch to commit the lockfiles to (never main)
        required: true
        type: string
      cargo:
        description: Also regenerate src-tauri/Cargo.lock (re-resolves every crate)
        required: false
        type: boolean
        default: true
      icons:
        description: Also regenerate the desktop icon set from src-tauri/icons/app-icon.svg
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  lockfiles:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TARGET_BRANCH: ${{ inputs.branch }}
    steps:
      - name: Refuse the default branch
        run: |
          if [ "$TARGET_BRANCH" = "main" ]; then
            echo "Refusing to commit to main" >&2
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # .npmrc sets legacy-peer-deps=true; the flag is repeated for clarity.
      - name: package-lock.json
        run: |
          npm --version
          npm install --package-lock-only --legacy-peer-deps --ignore-scripts --no-audit --no-fund
      - uses: dtolnay/rust-toolchain@stable
        if: ${{ inputs.cargo }}
      # "fallback" prefers crate versions compatible with rust-version (1.88).
      - name: src-tauri/Cargo.lock
        if: ${{ inputs.cargo }}
        working-directory: src-tauri
        env:
          CARGO_RESOLVER_INCOMPATIBLE_RUST_VERSIONS: fallback
        run: |
          cargo --version
          cargo generate-lockfile
      # Desktop-only shell: the android/ios outputs are dropped (and ignored in
      # src-tauri/.gitignore).
      - name: src-tauri/icons
        if: ${{ inputs.icons }}
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx tauri icon src-tauri/icons/app-icon.svg
          rm -rf src-tauri/icons/android src-tauri/icons/ios
          ls -l src-tauri/icons
      - name: Commit to the feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json src-tauri/Cargo.lock
          if [ "${{ inputs.icons }}" = "true" ]; then git add src-tauri/icons; fi
          if git diff --cached --quiet; then
            echo "Generated files unchanged"
            exit 0
          fi
          git diff --cached --stat
          tools="npm $(npm --version)"
          if command -v cargo >/dev/null; then tools="$tools, $(cargo --version)"; fi
          if [ "${{ inputs.icons }}" = "true" ]; then tools="$tools, $(npx tauri --version)"; fi
          git commit -m "chore: regenerate generated files" \
            -m "Generated by the lockfiles workflow ($tools, cargo input: ${{ inputs.cargo }}, icons input: ${{ inputs.icons }})."
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
