name: Generate lockfiles

# Manual tool: regenerates package-lock.json and src-tauri/Cargo.lock on a
# feature branch and commits them there, so large generated files never have
# to be retyped through the GitHub API. Review the result in a normal PR.
on:
  workflow_dispatch:
    inputs:
      branch:
        description: Feature branch to commit the lockfiles to (never main)
        required: true
        type: string

permissions:
  contents: read

jobs:
  lockfiles:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TARGET_BRANCH: ${{ inputs.branch }}
    steps:
      - name: Refuse the default branch
        run: |
          if [ "$TARGET_BRANCH" = "main" ]; then
            echo "Refusing to commit to main" >&2
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # .npmrc sets legacy-peer-deps=true; the flag is repeated for clarity.
      - name: package-lock.json
        run: |
          npm --version
          npm install --package-lock-only --legacy-peer-deps --ignore-scripts --no-audit --no-fund
      - uses: dtolnay/rust-toolchain@stable
      # "fallback" prefers crate versions compatible with rust-version (1.85).
      - name: src-tauri/Cargo.lock
        working-directory: src-tauri
        env:
          CARGO_RESOLVER_INCOMPATIBLE_RUST_VERSIONS: fallback
        run: |
          cargo --version
          cargo generate-lockfile
      - name: Commit to the feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json src-tauri/Cargo.lock
          if git diff --cached --quiet; then
            echo "Lockfiles unchanged"
            exit 0
          fi
          wc -c package-lock.json src-tauri/Cargo.lock
          git commit -m "chore: generate package-lock.json and src-tauri/Cargo.lock" \
            -m "Generated by the lockfiles workflow (npm $(npm --version), $(cargo --version))."
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
